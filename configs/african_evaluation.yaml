# configs/african_evaluation.yaml
#
# African-language-focused evaluation, per-dataset.
#
# Run with:
#   python scripts/evaluate.py whisper_large_v3 --eval-config configs/african_evaluation.yaml

experiment_name: african_eval

datasets:

  fleurs:
    split: test
    # asr:
    #   languages:
    #     - am_et    # Amharic
    #     - ha_ng    # Hausa
    #     - ig_ng    # Igbo
    #     - lg_ug    # Luganda
    #     - ln_cd    # Lingala
    #     - sn_zw    # Shona
    #     - sw_ke    # Swahili
    #     - xh_za    # Xhosa
    #     - yo_ng    # Yoruba
    #     - zu_za    # Zulu
    #     - en_us    # English
    #     - ar_eg    # Arabic
    #     - fr_fr    # French
    #     - pt_br    # Portuguese
    ast:
      sources: [am_et, ha_ng, ig_ng, lg_ug, ln_cd, sn_zw, sw_ke, xh_za, yo_ng, zu_za, en_us, ar_eg, fr_fr, pt_br]
      anchors: [en_us]
      direction: both

  mbaza_fleurs_rw:
    local_path: /ocean/projects/cis250145p/shared/datasets/mbazaNLP_fleurs-kinyarwanda
    split: test
    asr:
      languages: [rw_rw]
    ast:
      sources: [rw_rw]
      anchors: [en_us]
      direction: both

  # bembaspeech:
  #   local_path: /ocean/projects/cis250145p/shared/datasets/bemba_speech/BembaSpeech/bem
  #   split: test
  #   asr:
  #     languages: [bem]

  bigc:
    local_path: /ocean/projects/cis250145p/shared/datasets/bigc/data/bem
    split: test
    asr:
      languages: [bem]
    ast:
      pairs:
        - [bem, en_us]


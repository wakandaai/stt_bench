# configs/african_evaluation.yaml
#
# African-language-focused evaluation, per-dataset.
#
# Run with:
#   python scripts/evaluate.py whisper_large_v3 --eval-config configs/african_evaluation.yaml

experiment_name: african_eval

datasets:

  fleurs:
    split: test
    asr:
      languages:
        - am_et    # Amharic
        - ha_ng    # Hausa
        - ig_ng    # Igbo
        - lg_ug    # Luganda
        - ln_cd    # Lingala
        - sn_zw    # Shona
        - sw_ke    # Swahili
        - xh_za    # Xhosa
        - yo_ng    # Yoruba
        - zu_za    # Zulu
        - en_us    # English
        - ar_eg    # Arabic
        - fr_fr    # French
        - pt_br    # Portuguese

  mbaza_fleurs_rw:
    local_path: /ocean/projects/cis250145p/shared/datasets/mbazaNLP_fleurs-kinyarwanda
    split: test
    asr:
      languages: [rw_rw]

  bembaspeech:
    local_path: /ocean/projects/cis250145p/shared/datasets/bemba_speech/BembaSpeech/bem
    split: test
    asr:
      languages: [bem]

  bigc:
    local_path: /ocean/projects/cis250145p/shared/datasets/bigc/data/bem
    split: test
    asr:
      languages: [bem]

  nchlt:
    local_path: /ocean/projects/cis250145p/shared/datasets/NCHLT
    split: test
    asr:
      languages:
        - st_za
        - tn_za
        - xh_za
        - zu_za

  # Waxal (google/WaxalNLP) — HuggingFace-backed, ASR-only.
  waxal:
    split: test
    asr:
      languages:
        - am_et
        - ln_cd
        - lg_ug
        - mg_mg    # Malagasy
        - sn_zw 
        - ti_et    # Tigrinya